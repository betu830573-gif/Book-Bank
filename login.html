<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Access Portal - Book Bank System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet"/>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <i class="fa-solid fa-graduation-cap fa-xl text-primary me-2"></i>
            <span>CAMPUS</span>&nbsp;BOOKBANK
        </a>

        <a href="index.html" class="btn btn-outline-primary btn-sm rounded-pill px-3">
            <i class="fa-solid fa-arrow-left me-1"></i>
            Back to Home
        </a>

    </div>
</nav>

<!-- Auth Wrapper -->
<div class="auth-wrapper">

    <div class="auth-card">

        <!-- Header -->
        <div class="auth-header">
            <h3 class="fw-bold mb-1">Access Gateway</h3>
            <p class="mb-0 opacity-75">
                Connect to your personal Book Bank records
            </p>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-pills nav-fill bg-light p-2" role="tablist">

            <li class="nav-item">
                <button class="nav-link active py-2 rounded-pill"
                        data-bs-toggle="tab"
                        data-bs-target="#student-pane">
                    <i class="fa-solid fa-user-graduate me-1"></i>
                    Student
                </button>
            </li>

            <li class="nav-item">
                <button class="nav-link py-2 rounded-pill"
                        data-bs-toggle="tab"
                        data-bs-target="#admin-pane">
                    <i class="fa-solid fa-user-shield me-1"></i>
                    Admin
                </button>
            </li>

        </ul>

        <div class="tab-content auth-body">

            <!-- ================= STUDENT ================= -->
            <div class="tab-pane fade show active" id="student-pane">

                <!-- LOGIN BOX -->
                <div id="student-login-box">

                    <h5 class="fw-bold text-primary mb-3">
                        Student Login
                    </h5>

                    <form id="studentLoginForm">

                        <div class="mb-3">
                            <label class="form-label">Email</label>

                            <input
                                type="email"
                                class="form-control rounded-3"
                                id="stuLoginEmail"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>

                            <input
                                type="password"
                                class="form-control rounded-3"
                                id="stuLoginPassword"
                                required
                            />
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100 rounded-3">

                            <i class="fa-solid fa-right-to-bracket me-2"></i>
                            Login

                        </button>

                    </form>

                    <p class="text-center mt-3">
                        Don't have account?

                        <a href="#"
                           onclick="toggleStuForms(true)">
                            Signup
                        </a>
                    </p>

                </div>

                <!-- SIGNUP BOX -->
                <div id="student-signup-box" class="d-none">

                    <h5 class="fw-bold text-primary mb-3">
                        Student Signup
                    </h5>

                    <form id="studentSignupForm">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>

                            <input
                                type="text"
                                class="form-control rounded-3"
                                id="stuRegName"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>

                            <input
                                type="email"
                                class="form-control rounded-3"
                                id="stuRegEmail"
                                required
                            />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>

                            <input
                                type="password"
                                class="form-control rounded-3"
                                id="stuRegPassword"
                                required
                            />
                        </div>

                        <button type="submit"
                                class="btn btn-success w-100 rounded-3">

                            <i class="fa-solid fa-user-plus me-2"></i>
                            Create Account

                        </button>

                    </form>

                    <p class="text-center mt-3">
                        Already have account?

                        <a href="#"
                           onclick="toggleStuForms(false)">
                            Login
                        </a>
                    </p>

                </div>

            </div>

            <!-- ================= ADMIN ================= -->
            <div class="tab-pane fade" id="admin-pane">

                <h5 class="fw-bold text-primary mb-3">
                    Admin Login
                </h5>

                <form id="adminLoginForm">

                    <div class="mb-3">
                        <label class="form-label">
                            Admin Email
                        </label>

                        <input
                            type="email"
                            class="form-control rounded-3"
                            id="adminEmail"
                            required
                        />
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control rounded-3"
                            id="adminPassword"
                            required
                        />
                    </div>

                    <button type="submit"
                            class="btn btn-danger w-100 rounded-3">

                        <i class="fa-solid fa-lock-open me-2"></i>
                        Admin Login

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase Auth Script -->
<script type="module">

import { auth } from "./firebase-config.js";

import {
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/11.9.1/firebase-auth.js";


// TOGGLE FORMS
window.toggleStuForms = function(showSignup) {

    const loginBox = document.getElementById("student-login-box");
    const signupBox = document.getElementById("student-signup-box");

    if (showSignup) {

        loginBox.classList.add("d-none");
        signupBox.classList.remove("d-none");

    } else {

        loginBox.classList.remove("d-none");
        signupBox.classList.add("d-none");

    }

};


// STUDENT LOGIN
document.getElementById("studentLoginForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
        document.getElementById("stuLoginEmail").value;

    const password =
        document.getElementById("stuLoginPassword").value;

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        alert("Student Login Successful");

        window.location.href =
            "dashboard-student.html";

    } catch (error) {

        alert(error.message);
        console.log(error);

    }

});


// STUDENT SIGNUP
document.getElementById("studentSignupForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
        document.getElementById("stuRegEmail").value;

    const password =
        document.getElementById("stuRegPassword").value;

    try {

        await createUserWithEmailAndPassword(
            auth,
            email,
            password
        );

        alert("Account Created Successfully");

        toggleStuForms(false);

    } catch (error) {

        alert(error.message);
        console.log(error);

    }

});


// ADMIN LOGIN
document.getElementById("adminLoginForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
        document.getElementById("adminEmail").value;

    const password =
        document.getElementById("adminPassword").value;

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        // ADMIN EMAIL CHECK
        if (email === "admin@bookbank.com") {

            alert("Admin Login Successful");

            window.location.href =
                "dashboard-admin.html";

        } else {

            alert("You are not admin");

        }

    } catch (error) {

        alert(error.message);
        console.log(error);

    }

});

</script>

</body>
</html>
