<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Access Portal - Book Bank System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet"/>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">

        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <i class="fa-solid fa-graduation-cap fa-xl text-primary me-2"></i>
            <span class="fw-bold">CAMPUS BOOKBANK</span>
        </a>

        <a href="index.html"
           class="btn btn-outline-primary btn-sm rounded-pill px-3">

            <i class="fa-solid fa-arrow-left me-1"></i>
            Back to Home

        </a>

    </div>
</nav>

<!-- AUTH WRAPPER -->
<div class="auth-wrapper py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                    <!-- HEADER -->
                    <div class="bg-primary text-white text-center p-4">

                        <h3 class="fw-bold mb-1">
                            Access Gateway
                        </h3>

                        <p class="mb-0 opacity-75">
                            Connect to your Book Bank account
                        </p>

                    </div>

                    <div class="card-body p-4">

                        <!-- TABS -->
                        <ul class="nav nav-pills nav-fill bg-light p-2 rounded-3 mb-4">

                            <li class="nav-item">
                                <button
                                    class="nav-link active rounded-pill"
                                    id="student-tab"
                                    data-bs-toggle="tab"
                                    data-bs-target="#student-pane">

                                    <i class="fa-solid fa-user-graduate me-1"></i>
                                    Student

                                </button>
                            </li>

                            <li class="nav-item">
                                <button
                                    class="nav-link rounded-pill"
                                    id="admin-tab"
                                    data-bs-toggle="tab"
                                    data-bs-target="#admin-pane">

                                    <i class="fa-solid fa-user-shield me-1"></i>
                                    Admin

                                </button>
                            </li>

                        </ul>

                        <!-- TAB CONTENT -->
                        <div class="tab-content">

                            <!-- ================= STUDENT ================= -->
                            <div class="tab-pane fade show active"
                                 id="student-pane">

                                <!-- LOGIN -->
                                <div id="student-login-box">

                                    <h5 class="fw-bold text-primary mb-3">
                                        Student Login
                                    </h5>

                                    <form id="studentLoginForm">

                                        <div class="mb-3">

                                            <label class="form-label">
                                                Email
                                            </label>

                                            <input
                                                type="email"
                                                class="form-control rounded-3"
                                                id="stuLoginEmail"
                                                placeholder="student@gmail.com"
                                                required
                                            />

                                        </div>

                                        <div class="mb-3">

                                            <label class="form-label">
                                                Password
                                            </label>

                                            <input
                                                type="password"
                                                class="form-control rounded-3"
                                                id="stuLoginPassword"
                                                placeholder="********"
                                                required
                                            />

                                        </div>

                                        <button
                                            type="submit"
                                            class="btn btn-primary w-100 rounded-3 py-2">

                                            <i class="fa-solid fa-right-to-bracket me-2"></i>
                                            Login

                                        </button>

                                    </form>

                                    <p class="text-center mt-3">

                                        Don't have account?

                                        <a href="#"
                                           onclick="toggleStuForms(true)">
                                            Signup
                                        </a>

                                    </p>

                                </div>

                                <!-- SIGNUP -->
                                <div id="student-signup-box"
                                     class="d-none">

                                    <h5 class="fw-bold text-success mb-3">
                                        Student Signup
                                    </h5>

                                    <form id="studentSignupForm">

                                        <!-- FULL NAME -->
                                        <div class="mb-3">

                                            <label class="form-label">
                                                Full Name
                                            </label>

                                            <input
                                                type="text"
                                                class="form-control rounded-3"
                                                id="stuRegName"
                                                placeholder="Enter Full Name"
                                                required
                                            />

                                        </div>

                                        <!-- STUDENT ID -->
                                        <div class="mb-3">

                                            <label class="form-label">
                                                Student ID
                                            </label>

                                            <input
                                                type="text"
                                                class="form-control rounded-3"
                                                id="stuRegId"
                                                placeholder="e.g STU2026"
                                                required
                                            />

                                        </div>

                                        <!-- EMAIL -->
                                        <div class="mb-3">

                                            <label class="form-label">
                                                Email
                                            </label>

                                            <input
                                                type="email"
                                                class="form-control rounded-3"
                                                id="stuRegEmail"
                                                placeholder="student@gmail.com"
                                                required
                                            />

                                        </div>

                                        <!-- DEPARTMENT -->
                                        <div class="mb-3">

                                            <label class="form-label">
                                                Department
                                            </label>

                                            <select
                                                class="form-select rounded-3"
                                                id="stuRegDept"
                                                required>

                                                <option value="">
                                                    Select Department
                                                </option>

                                                <option>
                                                    Computer Science
                                                </option>

                                                <option>
                                                    Mechanical Engineering
                                                </option>

                                                <option>
                                                    Electrical Engineering
                                                </option>

                                                <option>
                                                    Civil Engineering
                                                </option>

                                                <option>
                                                    BCA
                                                </option>

                                                <option>
                                                    BBA
                                                </option>

                                            </select>

                                        </div>

                                        <!-- YEAR -->
                                        <div class="mb-3">

                                            <label class="form-label">
                                                Year
                                            </label>

                                            <select
                                                class="form-select rounded-3"
                                                id="stuRegYear"
                                                required>

                                                <option value="">
                                                    Select Year
                                                </option>

                                                <option>
                                                    1st Year
                                                </option>

                                                <option>
                                                    2nd Year
                                                </option>

                                                <option>
                                                    3rd Year
                                                </option>

                                                <option>
                                                    4th Year
                                                </option>

                                            </select>

                                        </div>

                                        <!-- PASSWORD -->
                                        <div class="mb-3">

                                            <label class="form-label">
                                                Password
                                            </label>

                                            <input
                                                type="password"
                                                class="form-control rounded-3"
                                                id="stuRegPassword"
                                                placeholder="Minimum 6 Characters"
                                                required
                                            />

                                        </div>

                                        <button
                                            type="submit"
                                            class="btn btn-success w-100 rounded-3 py-2">

                                            <i class="fa-solid fa-user-plus me-2"></i>
                                            Create Account

                                        </button>

                                    </form>

                                    <p class="text-center mt-3">

                                        Already have account?

                                        <a href="#"
                                           onclick="toggleStuForms(false)">
                                            Login
                                        </a>

                                    </p>

                                </div>

                            </div>

                            <!-- ================= ADMIN ================= -->
                            <div class="tab-pane fade"
                                 id="admin-pane">

                                <h5 class="fw-bold text-danger mb-3">
                                    Admin Login
                                </h5>

                                <form id="adminLoginForm">

                                    <div class="mb-3">

                                        <label class="form-label">
                                            Admin Email
                                        </label>

                                        <input
                                            type="email"
                                            class="form-control rounded-3"
                                            id="adminEmail"
                                            placeholder="admin@bookbank.com"
                                            required
                                        />

                                    </div>

                                    <div class="mb-3">

                                        <label class="form-label">
                                            Password
                                        </label>

                                        <input
                                            type="password"
                                            class="form-control rounded-3"
                                            id="adminPassword"
                                            placeholder="********"
                                            required
                                        />

                                    </div>

                                    <button
                                        type="submit"
                                        class="btn btn-danger w-100 rounded-3 py-2">

                                        <i class="fa-solid fa-lock-open me-2"></i>
                                        Admin Login

                                    </button>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- BACKUP IMPORT -->
<input
    type="file"
    id="backupFileInput"
    accept=".json"
    style="display:none"
    onchange="importBackup(event)"
/>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase SDK (Compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<!-- Core DB JS -->
<script src="assets/js/db.js"></script>

<script>
// TOGGLE FORMS
window.toggleStuForms = function(showSignup) {
    const loginBox = document.getElementById("student-login-box");
    const signupBox = document.getElementById("student-signup-box");
    if (showSignup) {
        loginBox.classList.add("d-none");
        signupBox.classList.remove("d-none");
    } else {
        loginBox.classList.remove("d-none");
        signupBox.classList.add("d-none");
    }
};

// ================= STUDENT LOGIN =================
document.getElementById('studentLoginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('stuLoginEmail').value.trim();
    const password = document.getElementById('stuLoginPassword').value.trim();

    const res = window.db.loginStudent(email, password);
    if (res.success) {
        alert("Student Login Successful");
        setTimeout(() => {
            window.location.href = "dashboard-student.html";
        }, 500);
    } else {
        alert(res.message);
    }
});

// ================= STUDENT SIGNUP =================
document.getElementById('studentSignupForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const id = document.getElementById('stuRegId').value.trim();
    const name = document.getElementById('stuRegName').value.trim();
    const email = document.getElementById('stuRegEmail').value.trim();
    const dept = document.getElementById('stuRegDept').value;
    const password = document.getElementById('stuRegPassword').value;

    if (password.length < 6) {
        alert("Password must be at least 6 characters");
        return;
    }

    const res = window.db.signupStudent(id, name, email, password, dept);
    if (res.success) {
        alert("Registration Successful");
        toggleStuForms(false);
        document.getElementById('stuLoginEmail').value = email;
    } else {
        alert(res.message);
    }
});

// ================= ADMIN LOGIN =================
document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value.trim();

    const res = window.db.loginAdmin(email, password);
    if (res.success) {
        alert("Welcome Admin");
        setTimeout(() => {
            window.location.href = "dashboard-admin.html";
        }, 500);
    } else {
        alert(res.message);
    }
});

// ================= BACKUP IMPORT =================
window.importBackup = function(event) {
    const input = event.target;
    const reader = new FileReader();
    reader.onload = function() {
        const text = reader.result;
        const res = window.db.importStudentData(text);
        if (res.success) {
            alert("Backup Restored Successfully");
        } else {
            alert(res.message);
        }
    };
    if (input.files[0]) {
        reader.readAsText(input.files[0]);
    }
};
</script>

</body>
</html>
