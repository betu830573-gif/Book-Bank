<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reader - Campus BookBank</title>
    <meta name="description" content="Read books online - Campus Book Bank by Vivek Sen">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── TOP HEADER ── */
        .reader-header {
            background: linear-gradient(135deg, #1d3557 0%, #2d6a9f 100%);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.5);
            flex-shrink: 0;
            z-index: 100;
            min-height: 60px;
        }

        .btn-back {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 7px 18px;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }
        .btn-back:hover { background: rgba(255,255,255,0.28); color: #fff; }

        .book-info { flex: 1; min-width: 0; }
        .book-info h5 {
            margin: 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .book-info small { color: rgba(255,255,255,0.65); font-size: 0.72rem; }

        .header-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }

        .btn-hdr {
            border: none;
            border-radius: 50px;
            padding: 7px 16px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s, transform 0.15s;
            white-space: nowrap;
        }
        .btn-hdr:hover { opacity: 0.88; transform: translateY(-1px); color: #fff; }

        .btn-download { background: linear-gradient(135deg, #2ecc71, #27ae60); color: #fff; }
        .btn-gbooks   { background: linear-gradient(135deg, #4285f4, #1a73e8); color: #fff; }
        .btn-archive  { background: linear-gradient(135deg, #6c757d, #495057); color: #fff; }

        /* ── VIEWER BODY ── */
        .reader-body {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #161b22;
        }

        #viewerCanvas {
            width: 100%;
            height: 100%;
        }

        #iframeViewer {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            display: none;
        }

        /* Loading screen */
        .loading-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #0d1117;
        }
        .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(69,123,157,0.25);
            border-top-color: #457b9d;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-screen p { color: #8b949e; font-size: 0.9rem; }

        /* No-preview fallback */
        .no-preview {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            gap: 12px;
            display: none;
        }
        .no-preview .icon-wrap {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(69,123,157,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .no-preview .icon-wrap i { font-size: 3rem; color: #457b9d; }
        .no-preview h4 { color: #e6edf3; font-size: 1.2rem; font-weight: 600; }
        .no-preview p  { color: #8b949e; max-width: 420px; font-size: 0.88rem; line-height: 1.6; }
        .no-preview .alt-buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }

        .btn-big {
            border: none;
            border-radius: 50px;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            color: #fff;
        }
        .btn-big:hover { transform: translateY(-2px); color: #fff; }
        .btn-big.green  { background: linear-gradient(135deg,#2ecc71,#27ae60); box-shadow: 0 4px 15px rgba(46,204,113,0.3); }
        .btn-big.blue   { background: linear-gradient(135deg,#4285f4,#1a73e8); box-shadow: 0 4px 15px rgba(66,133,244,0.3); }
        .btn-big.gray   { background: linear-gradient(135deg,#6c757d,#495057); box-shadow: 0 4px 15px rgba(108,117,125,0.3); }

        /* Responsive */
        @media (max-width: 600px) {
            .reader-header { gap: 8px; padding: 8px 12px; }
            .book-info h5  { font-size: 0.82rem; }
            .btn-hdr       { padding: 5px 10px; font-size: 0.72rem; }
        }
    </style>
</head>
<body>

    <!-- ── HEADER ── -->
    <div class="reader-header">
        <a href="javascript:history.back()" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i>
            <span class="d-none d-sm-inline">Back</span>
        </a>

        <div class="book-info">
            <h5 id="bookTitle">Loading...</h5>
            <small id="bookAuthor"></small>
        </div>

        <div class="header-actions">
            <a id="btnGBooks" href="#" target="_blank" class="btn-hdr btn-gbooks">
                <i class="fa-brands fa-google"></i>
                <span class="d-none d-md-inline">Google Books</span>
            </a>
            <a id="btnArchive" href="#" target="_blank" class="btn-hdr btn-archive">
                <i class="fa-solid fa-box-archive"></i>
                <span class="d-none d-md-inline">Archive.org</span>
            </a>
            <a id="btnDownload" href="#" target="_blank" class="btn-hdr btn-download" style="display:none !important;">
                <i class="fa-solid fa-download"></i>
                <span class="d-none d-md-inline">Download</span>
            </a>
        </div>
    </div>

    <!-- ── READER BODY ── -->
    <div class="reader-body">

        <!-- Loading -->
        <div class="loading-screen" id="loadingScreen">
            <div class="spinner"></div>
            <p>Book viewer load ho raha hai...</p>
        </div>

        <!-- Google Books canvas -->
        <div id="viewerCanvas"></div>

        <!-- Iframe viewer (for PDF / Google Drive links) -->
        <iframe id="iframeViewer" allowfullscreen></iframe>

        <!-- No preview fallback -->
        <div class="no-preview" id="noPreview">
            <div class="icon-wrap">
                <i class="fa-solid fa-book-open-reader"></i>
            </div>
            <h4>Online Preview Unavailable</h4>
            <p>Is book ka online preview abhi available nahi hai. Niche diye links se try karo ya book download karo.</p>
            <div class="alt-buttons" id="altButtons"></div>
        </div>

    </div>

    <!-- Google Books previewlib -->
    <script src="https://books.google.com/books/previewlib.js"></script>
    <script>
        // ── Parse URL Params ──
        const p          = new URLSearchParams(window.location.search);
        const isbn       = p.get('isbn')        || '';
        const title      = p.get('title')       || 'Book';
        const author     = p.get('author')      || '';
        const readUrl    = p.get('readUrl')      || '';
        const dlUrl      = p.get('downloadUrl') || '';

        // ── Populate Header ──
        document.getElementById('bookTitle').textContent  = title;
        document.getElementById('bookAuthor').textContent = author;

        // Google Books link
        const gLink = `https://www.google.com/search?q=${encodeURIComponent(title + ' ' + author + ' read online')}`;
        document.getElementById('btnGBooks').href = `https://books.google.com/books?q=${encodeURIComponent(title + ' ' + author)}`;

        // Archive.org link
        document.getElementById('btnArchive').href = `https://archive.org/search?query=${encodeURIComponent(title)}`;

        // Download button
        if (dlUrl && dlUrl !== 'null') {
            const dlBtn = document.getElementById('btnDownload');
            dlBtn.href = dlUrl;
            dlBtn.style.display = 'inline-flex';
        }

        // ── Helper: show no-preview screen ──
        function showNoPreview() {
            document.getElementById('loadingScreen').style.display   = 'none';
            document.getElementById('viewerCanvas').style.display    = 'none';
            document.getElementById('iframeViewer').style.display    = 'none';
            document.getElementById('noPreview').style.display       = 'flex';

            const altBtns = document.getElementById('altButtons');
            altBtns.innerHTML = `
                <a href="https://books.google.com/books?q=${encodeURIComponent(title + ' ' + author)}"
                   target="_blank" class="btn-big blue">
                    <i class="fa-brands fa-google"></i> Google Books
                </a>
                <a href="https://archive.org/search?query=${encodeURIComponent(title)}"
                   target="_blank" class="btn-big gray">
                    <i class="fa-solid fa-box-archive"></i> Archive.org
                </a>
                ${dlUrl && dlUrl !== 'null' ? `
                <a href="${dlUrl}" target="_blank" class="btn-big green">
                    <i class="fa-solid fa-download"></i> Download Book
                </a>` : ''}
            `;
        }

        // ── Load Google Books Viewer (by ISBN) ──
        function loadGoogleBooksViewer() {
            const canvas = document.getElementById('viewerCanvas');

            try {
                google.books.load();

                function initialize() {
                    const viewer = new google.books.DefaultViewer(canvas);
                    const cleanIsbn = isbn.replace(/-/g, '');
                    viewer.load('ISBN:' + cleanIsbn, showNoPreview, function() {
                        document.getElementById('loadingScreen').style.display = 'none';
                    });
                }

                google.books.setOnLoadCallback(initialize);
            } catch(e) {
                showNoPreview();
            }
        }

        // ── Load Iframe Viewer (PDF / Google Drive / any URL) ──
        function loadIframeViewer(url) {
            const iframe = document.getElementById('iframeViewer');

            // If it's a PDF or Drive link, wrap in Google Docs Viewer
            let viewerSrc = url;
            const isDirectPDF = url.toLowerCase().endsWith('.pdf');
            const isDrive     = url.includes('drive.google.com');

            if (isDirectPDF || isDrive) {
                // Google Docs embedded PDF viewer
                const encodedUrl = encodeURIComponent(url);
                viewerSrc = `https://docs.google.com/viewer?url=${encodedUrl}&embedded=true`;
            }

            iframe.src = viewerSrc;
            iframe.style.display = 'block';
            document.getElementById('loadingScreen').style.display = 'none';

            iframe.onerror = () => {
                iframe.style.display = 'none';
                isbn ? loadGoogleBooksViewer() : showNoPreview();
            };

            // Fallback timeout if iframe doesn't load
            setTimeout(() => {
                if (iframe.style.display === 'block' && iframe.contentDocument && iframe.contentDocument.body && iframe.contentDocument.body.innerHTML === '') {
                    iframe.style.display = 'none';
                    isbn ? loadGoogleBooksViewer() : showNoPreview();
                }
            }, 8000);
        }

        // ── Main Logic ──
        window.addEventListener('DOMContentLoaded', () => {
            const validReadUrl = readUrl && readUrl !== 'null' && readUrl.trim() !== '';

            if (validReadUrl) {
                loadIframeViewer(readUrl);
            } else if (isbn) {
                loadGoogleBooksViewer();
            } else {
                showNoPreview();
            }
        });
    </script>
</body>
</html>
